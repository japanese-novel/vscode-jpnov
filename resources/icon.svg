<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Master of the product icon, full bleed: iOS and the OG card take it as is, and a user
       that wants the rounded tile wraps it (website/src/icon.ts). resources/icon.png is that
       tile at 256px: `npm run build` in website/, then
       `resvg -w 256 -h 256 website/dist/favicon.svg resources/icon.png`. Narration lines start
       one em lower (字下げ) while the dialogue 「 opens at the line head, and the bracket pair is
       point-symmetric about (60,65) like the vertical forms ﹁/﹂. -->
  <rect width="128" height="128" fill="#26211C"/>
  <g fill="none" stroke="#F4EDDD" stroke-linecap="round">
    <path d="M88 33v71" stroke-width="10"/>
    <path d="M60 38v54" stroke-width="10"/>
    <path d="M32 33v41" stroke-width="10"/>
    <g stroke-width="5" stroke-linejoin="round">
      <path d="M53 21h13v9"/>
      <path d="M54 100v9h13"/>
    </g>
  </g>
  <g fill="none" stroke="#D2492A" stroke-width="4.5" stroke-linecap="round">
    <path d="M101.5 39v11M101.5 58v11"/>
  </g>
  <rect x="25.5" y="86" width="13" height="13" rx="3" fill="#D2492A"/>
</svg>
