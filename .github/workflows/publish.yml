name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publish

jobs:
  publish:
    name: Test, package, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve version, guard collisions
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "publish must be dispatched from main (got $GITHUB_REF_NAME)"; exit 1
          fi
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v$VERSION"
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists — bump the version in package.json first"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — bump the version in package.json first"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Sign the release tag
        env:
          TAG_SIGNING_KEY: ${{ secrets.TAG_SIGNING_KEY }}
        run: |
          if [ -z "$TAG_SIGNING_KEY" ]; then
            echo "secret TAG_SIGNING_KEY is not set — add the armored private key of the release signing key"; exit 1
          fi
          printf '%s\n' "$TAG_SIGNING_KEY" | gpg --batch --import
          KEYS="$(gpg --batch --with-colons --list-secret-keys)"
          SIGNER="$(printf '%s\n' "$KEYS" | awk -F: '$1 == "uid" { print $10; exit }')"
          git config user.name "$(printf '%s' "$SIGNER" | sed -E 's/ *(\([^)]*\))? *<[^>]*>$//')"
          git config user.email "$(printf '%s' "$SIGNER" | sed -E 's/^.*<([^>]*)>$/\1/')"
          git config user.signingkey "$(printf '%s\n' "$KEYS" | awk -F: '$1 == "fpr" { print $10; exit }')"
          git tag --sign --message "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.tag }}" "$GITHUB_SHA"
      - name: Unit tests
        run: npm test
      - name: Integration suites
        run: npm run test:integration
      - name: E2E smoke
        run: npm run test:e2e
        env:
          JPNOV_E2E_REQUIRE_BROWSER: '1'
      - name: Package
        run: npm run package
      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --packagePath "jpnov-${{ steps.meta.outputs.version }}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Push the tag, release with the VSIX attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "refs/tags/${{ steps.meta.outputs.tag }}"
          gh release create "${{ steps.meta.outputs.tag }}" "jpnov-${{ steps.meta.outputs.version }}.vsix" --verify-tag --title "${{ steps.meta.outputs.tag }}" --generate-notes
      - name: Deploy the website at this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --ref "refs/tags/${{ steps.meta.outputs.tag }}"
